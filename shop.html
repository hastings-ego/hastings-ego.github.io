    <style>
        /* --- Minimalist Core Variables & Reset --- */
        :root {
            --text-main: #111111;
            --text-muted: #767676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            color: var(--text-main);
            font-family: var(--font);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* --- Header --- */
        .shop-header {
            padding: 6rem 0 3rem 0;
        }

        .shop-header h1 {
            font-size: 1.75rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            margin-bottom: 0.5rem;
        }

        .shop-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* --- Minimal Navigation / Filter Bar --- */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 3rem;
            font-size: 0.9rem;
        }

        .filter-group {
            display: flex;
            gap: 1.5rem;
        }

        .filter-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
            padding: 0.25rem 0;
            transition: color 0.2s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            color: var(--text-main);
        }

        .filter-btn.active {
            font-weight: 500;
        }

        /* --- Centered Product Grid --- */
        .products-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 3rem 2rem;
            width: 100%;
            justify-content: center;
        }

        /* --- Minimal Product Item --- */
        .product-item {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .product-image-slot {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 1rem;
            transition: opacity 0.2s ease;
        }

        .product-item:hover .product-image-slot {
            opacity: 0.85;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .product-title {
            font-weight: 500;
        }

        .product-price {
            color: var(--text-main);
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* --- Elegant Empty State View --- */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6rem 0;
            width: 100%;
        }

        .empty-icon {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .empty-state h3 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .empty-state p {
            font-size: 0.9rem;
            color: var(--text-muted);
            max-width: 320px;
            margin-bottom: 1.5rem;
        }

        .reset-btn {
            background-color: var(--text-main);
            color: var(--bg);
            border: none;
            padding: 0.5rem 1.25rem;
            font-size: 0.85rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .reset-btn:hover {
            opacity: 0.9;
        }

        /* --- Section Divider for Demonstration Purpose --- */
        .demo-divider {
            margin: 6rem 0 2rem 0;
            border: none;
            border-top: 1px dashed var(--border);
            text-align: center;
        }

        .demo-label {
            display: inline-block;
            background: var(--bg);
            padding: 0 1rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            transform: translateY(-50%);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* --- Responsive Breaks --- */
        @media (max-width: 600px) {
            .shop-header {
                padding: 4rem 0 2rem 0;
            }

            .filter-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 2rem 1.5rem;
            }
        }
    </style>
